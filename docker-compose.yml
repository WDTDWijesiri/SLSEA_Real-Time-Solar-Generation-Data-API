services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: slsea_solar
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:mysql@db:3306/slsea_solar
      JWT_SECRET: local-development-secret-change-before-deploy
      TRUST_PROXY: 1
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
